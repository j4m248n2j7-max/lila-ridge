<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lila Ridge — Everyday clothes & accessories</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="announcement">Printed to order • Free shipping over $75</div>

  <header>
    <div class="header-inner">
      <a href="/" class="logo">Lila Ridge</a>
      <nav>
        <a href="#new">New</a>
        <a href="#women">Women</a>
        <a href="#men">Men</a>
        <a href="#kids">Kids</a>
        <a href="#home">Home</a>
      </nav>
      <input type="search" id="search" placeholder="Search">
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Everyday items<br>made for you</h1>
      <p>Clothes and accessories, printed to order.</p>
      <a href="#products" class="btn">Shop now</a>
    </section>

    <section id="products" class="section">
      <div class="grid" id="product-grid"></div>
    </section>
  </main>

  <footer>
    <p>Printed to order • 2–7 business days production, then shipping.</p>
    <p>© 2026 Lila Ridge</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
