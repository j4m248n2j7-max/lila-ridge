<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — Lila Ridge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shipping">Shipping to the USA • UK • Canada. US/UK: about 5–8 days | Canada: 2–4 weeks.</div>
  <header>
    <a href="/" class="logo">Lila Ridge</a>
  </header>

  <main class="product-page">
    <div class="product-layout">
      <div class="product-image">
        <img id="product-img" src="" alt="">
      </div>
      <div class="product-info">
        <h1 id="product-title">Product</h1>
        <p class="price" id="product-price">$0.00</p>
        <p id="product-desc">Printed to order.</p>
        <button class="add-btn">Add to Cart</button>
        <p class="note">Printed to order • 2–7 business days production, then shipping.</p>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    const p = products.find(x => x.id === id) || products[0];

    document.getElementById('product-title').textContent = p.title;
    document.getElementById('product-price').textContent = '$' + p.price.toFixed(2);
    document.getElementById('product-desc').textContent = p.desc;
    document.getElementById('product-img').src = p.img;
    document.getElementById('product-img').alt = p.title;
    document.title = p.title + ' — Lila Ridge';
  </script>
</body>
</html>
